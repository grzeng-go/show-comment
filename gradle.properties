ideaVersion=2020.1

# 离线配置
systemProp.intellij.publish.channel=nightly
org.gradle.offline=false
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=13004
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=13004
systemProp.http.nonProxyHosts=localhost|127.*|[::1]

# Local area network HTTPS solves SSL problems
#systemProp.javax.net.ssl.trustStore=file_name.jks
#StorePassword=should_be_set_elsewhere

#IntelliJ IDEA Ultimate Edition
ideType=IU


# region can use plugin in IDEA IU

#IntelliJ IDEA Community Edition
#ideType=IC

#GoLand
#ideType=GO

#PyCharm Professional Edition
#ideType=PY

#PyCharm Community Edition
#ideType=PC

# endregion



#CLion
#ideType=CL

#Rider
#ideType=RD

#JPS-only
#ideType=JP

#Gateway
#ideType=GW
